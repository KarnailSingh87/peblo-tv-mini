version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: peblo_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peblo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peblo_password}
      POSTGRES_DB: ${POSTGRES_DB:-peblo_tv_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-peblo_user} -d ${POSTGRES_DB:-peblo_tv_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: peblo_backend
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-peblo_user}:${POSTGRES_PASSWORD:-peblo_password}@db:5432/${POSTGRES_DB:-peblo_tv_db}
      - STORAGE_TYPE=local
      - LOCAL_STORAGE_DIR=/app/storage
      - SECRET_KEY=${SECRET_KEY:-super-secret-peblo-tv-jwt-signing-key-32chars}
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/app/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  cms:
    build:
      context: ../frontend/cms
      dockerfile: Dockerfile
    container_name: peblo_cms
    ports:
      - "3001:3001"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3001 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  viewer:
    build:
      context: ../frontend/viewer
      dockerfile: Dockerfile
    container_name: peblo_viewer
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  storage_data:
    driver: local
